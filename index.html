              '<div>' +
                '<h3 class="card-title">' + item.name + '</h3>' +
                '<p class="card-subtitle">' + item.title + '</p>' +
              '</div>' +
            '</div>' +
            '<p class="card-territory">📍 ' + item.territory + '</p>' +
            '<p class="card-birthdeath">🏛️ ' + item.birth + '</p>' +
            '<p class="card-snippet">' + item.snippet + '</p>' +
          '</div>' +
          '<div>' +
            '<button class="read-btn" onclick="openBio(\'' + item.id + '\')">READ CHRONICLE</button>' +
          '</div>';
        grid.appendChild(card);
      });
    }

    function openBio(id) {
      var activeDataset = (currentTab === 'kings') ? kingsData : leadersData;
      var item = activeDataset.find(function(x) { return x.id === id; });
      if (!item) return;

      document.getElementById('modalImg').src = item.image;
      document.getElementById('modalTitle').textContent = item.name;
      document.getElementById('modalSubtitle').textContent = item.title;
      document.getElementById('modalTerritory').textContent = item.territory;
      document.getElementById('modalBirth').textContent = item.birth;
      document.getElementById('modalDeathText').textContent = item.deathDetails;
      
      var bioHTML = item.bio.map(function(line) {
        return '<p class="bio-paragraph">• ' + line + '</p>';
      }).join('');
      
      document.getElementById('modalBio').innerHTML = bioHTML;
      modal.classList.remove('hidden');
    }

    closeModal.onclick = function() {
      modal.classList.add('hidden');
    };

    window.onclick = function(e) {
      if (e.target === modal) modal.classList.add('hidden');
    };

    // Tab switching
    document.querySelectorAll('.cat-tab').forEach(function(tab) {
      tab.onclick = function() {
        document.querySelectorAll('.cat-tab').forEach(function(t) { t.classList.remove('active'); });
        tab.classList.add('active');
        currentTab = tab.dataset.category;
        render();
      };
    });

    // Filter switching
    document.querySelectorAll('.filter-btn').forEach(function(btn) {
      btn.onclick = function() {
        document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      };
    });

    // Search functionality
    document.getElementById('searchInput').oninput = function(e) {
      var query = e.target.value.toLowerCase();
      var activeDataset = (currentTab === 'kings') ? kingsData : leadersData;
      var filtered = activeDataset.filter(function(item) {
        return item.name.toLowerCase().includes(query) || item.title.toLowerCase().includes(query) || item.territory.toLowerCase().includes(query);
      });
      
      grid.innerHTML = '';
      filtered.forEach(function(item) {
        var card = document.createElement('div');
        card.className = 'legend-card';
        card.innerHTML = 
          '<div>' +
            '<div class="card-header-flex">' +
              '<img src="' + item.image + '" alt="' + item.name + '" class="card-avatar">' +
              '<div>' +
                '<h3 class="card-title">' + item.name + '</h3>' +
                '<p class="card-subtitle">' + item.title + '</p>' +
              '</div>' +
            '</div>' +
            '<p class="card-territory">📍 ' + item.territory + '</p>' +
            '<p class="card-birthdeath">🏛️ ' + item.birth + '</p>' +
            '<p class="card-snippet">' + item.snippet + '</p>' +
          '</div>' +
          '<div>' +
            '<button class="read-btn" onclick="openBio(\'' + item.id + '\')">READ CHRONICLE</button>' +
          '</div>';
        grid.appendChild(card);
      });
    };

    render();
  </script>
</body>
</html>
